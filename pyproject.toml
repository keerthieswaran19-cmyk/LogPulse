[project]
name = "logpulse"
version = "1.0.0"
description = "Application Log Analytics Pipeline – YottaFlex AI Data Engineering Challenge"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "pytest>=7.0",
    "streamlit>=1.28",
    "pyyaml>=6.0",
    "python-dateutil>=2.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
